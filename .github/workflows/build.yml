name: Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build lists
        if: github.event_name != 'push'
        env:
          AUTH_PM_UID: ${{ secrets.AUTH_PM_UID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          TOKEN_FILE: ${{ runner.temp }}/tokens.env
        run: go run .github/builder/*.go

      - name: Rotate secrets
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh secret set -f ${{ runner.temp }}/tokens.env -R $GITHUB_REPOSITORY

      - name: Commit
        if: github.event_name != 'push'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add protonvpn_*.json protonvpn_*.txt .github/assets
          git diff --quiet --cached || git commit -m "Update ProtonVPN IPs [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
