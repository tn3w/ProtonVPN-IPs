<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="Check whether an IP address belongs to ProtonVPN." />
        <title>Is ProtonVPN?</title>
        <style>
            :root {
                --bg: #f7f7fb;
                --card: #fff;
                --text: #211b35;
                --muted: #777388;
                --line: #e4e1ed;
                --purple: #6f59f6;
                --green: #159b72;
                --red: #d34d67;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #111016;
                    --card: #1c1a23;
                    --text: #f7f5ff;
                    --muted: #aaa5b7;
                    --line: #373441;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: radial-gradient(circle at 20% 10%, #e9e5ff, transparent 35%), var(--bg);
                color: var(--text);
                font:
                    16px 'Avenir Next',
                    'Trebuchet MS',
                    sans-serif;
            }
            main {
                width: min(560px, 100%);
                text-align: center;
            }
            h1 {
                margin: 0 0 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-size: clamp(2.4rem, 9vw, 4rem);
                font-weight: 500;
                letter-spacing: -0.06em;
            }
            .logo {
                width: min(310px, 58vw);
                height: auto;
            }
            form {
                position: relative;
            }
            input {
                width: 100%;
                height: 64px;
                padding: 0 115px 0 20px;
                border: 1px solid var(--line);
                border-radius: 14px;
                background: var(--card);
                color: var(--text);
                outline: 0;
                font: inherit;
                font-size: 17px;
                box-shadow: 0 12px 35px #211b3512;
            }
            input:focus {
                border-color: var(--purple);
                box-shadow:
                    0 0 0 4px #6f59f622,
                    0 12px 35px #211b3512;
            }
            button {
                position: absolute;
                right: 7px;
                top: 7px;
                height: 50px;
                padding: 0 22px;
                border: 0;
                border-radius: 10px;
                background: #6f59f6;
                color: #fff;
                font:
                    800 16px 'Avenir Next',
                    'Trebuchet MS',
                    sans-serif;
                letter-spacing: 0.01em;
                cursor: pointer;
                box-shadow: 0 5px 14px #6f59f655;
                transition:
                    transform 0.15s,
                    filter 0.15s,
                    box-shadow 0.15s;
            }

            button:hover {
                filter: brightness(1.08);
                transform: translateY(-1px);
                box-shadow: 0 7px 18px #6f59f666;
            }

            button:active {
                transform: translateY(0);
                box-shadow: 0 3px 9px #6f59f644;
            }

            button:disabled {
                opacity: 0.55;
                cursor: wait;
                transform: none;
            }
            #result {
                min-height: 28px;
                margin: 22px 0;
                color: var(--muted);
                line-height: 1.5;
            }
            .yes,
            .no {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .status {
                font-size: 28px;
                font-weight: 700;
                letter-spacing: 0.03em;
            }
            .yes .status {
                color: var(--green);
            }
            .no .status,
            .error {
                color: var(--red);
            }
            .tags {
                display: flex;
                gap: 7px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .tag {
                padding: 6px 10px;
                border: 1px solid #159b7266;
                border-radius: 8px;
                color: var(--green);
                background: #159b7212;
                font-size: 14px;
                font-weight: 600;
            }
            footer {
                position: fixed;
                bottom: 18px;
                left: 20px;
                right: 20px;
                text-align: center;
                color: var(--muted);
                font-size: 12px;
            }
            footer a {
                color: inherit;
                text-underline-offset: 3px;
                margin: 0 5px;
            }
            footer a:hover {
                color: var(--text);
            }
            .github {
                width: 13px;
                height: 13px;
                vertical-align: -2px;
                fill: currentColor;
            }
        </style>
    </head>

    <body>
        <main>
            <h1>
                Is
                <svg
                    class="logo"
                    viewBox="0 0 360 120"
                    role="img"
                    aria-label="ProtonVPN"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <defs>
                        <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6F59F6" />
                            <stop offset="100%" stop-color="#6F59F6" />
                        </linearGradient>
                        <linearGradient id="frontGrad" x1="0%" y1="0%" x2="50%" y2="100%">
                            <stop offset="0%" stop-color="#7253F6" />
                            <stop offset="100%" stop-color="#46DBDB" />
                        </linearGradient>
                        <clipPath id="logoClip">
                            <path d="M25 40Q20 32 30 34L86 42Q96 43 93 52L65 93Q58 103 52 93Z" />
                        </clipPath>
                    </defs>
                    <g clip-path="url(#logoClip)">
                        <rect width="120" height="120" fill="url(#backGrad)" />
                        <polygon points="0,0 48,0 60,120 0,120" fill="url(#frontGrad)" />
                    </g>
                    <text
                        x="115"
                        y="78"
                        font-family="Avenir Next, Century Gothic, Trebuchet MS, sans-serif"
                        font-size="48"
                        font-weight="600"
                    >
                        <tspan fill="currentColor">Proton</tspan>
                        <tspan fill="#6F59F6">VPN</tspan>
                    </text>
                </svg>
                ?
            </h1>

            <form id="form">
                <label for="ip" hidden>IP address</label>
                <input
                    id="ip"
                    placeholder="Enter an IP address"
                    autocomplete="off"
                    spellcheck="false"
                    required
                />
                <button id="check" disabled>Check</button>
            </form>

            <div id="result" aria-live="polite">Loading IP lists…</div>
        </main>

        <footer>
            <a href="https://github.com/tn3w/ProtonVPN-IPs">
                <svg class="github" viewBox="0 0 16 16" aria-hidden="true">
                    <path
                        d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.63 5.47 7.7.4.08.55-.18.55-.39 0-.19-.01-.7-.01-1.37-2.23.5-2.7-1.1-2.7-1.1-.36-.94-.89-1.19-.89-1.19-.73-.51.06-.5.06-.5.8.06 1.22.84 1.22.84.72 1.26 1.89.9 2.35.69.07-.53.28-.9.51-1.11-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.61.82-2.18-.08-.21-.36-1.03.08-2.15 0 0 .67-.22 2.2.83A7.45 7.45 0 0 1 8 3.9c.68 0 1.36.09 2 .27 1.53-1.05 2.2-.83 2.2-.83.44 1.12.16 1.94.08 2.15.51.57.82 1.29.82 2.18 0 3.12-1.87 3.8-3.65 4.01.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.14.47.55.39A8.14 8.14 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"
                    />
                </svg>
                GitHub
            </a>
            <span>·</span>
            <a
                href="https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_ips.txt"
                >exit IPs</a
            >
            <a
                href="https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_entry_ips.txt"
                >entry IPs</a
            >
            <a
                href="https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_entry_ip_ranges.txt"
                >ranges</a
            >
            <span>·</span>
            <a href="https://github.com/tn3w/ProtonVPN-IPs#files">how to load</a>
        </footer>

        <script>
            const URLS = [
                'https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_ips.txt',
                'https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_entry_ips.txt',
                'https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_entry_ip_ranges.txt',
            ];

            const $ = (s) => document.querySelector(s),
                result = $('#result'),
                input = $('#ip'),
                button = $('#check');

            const clean = (s) =>
                s
                    .split(/\r?\n/)
                    .map((x) => x.trim().toLowerCase())
                    .filter((x) => x && !x.startsWith('#'));

            function ip(value) {
                if (value.includes('.')) {
                    const p = value.split('.');
                    if (p.length !== 4 || p.some((x) => !/^\d+$/.test(x) || +x > 255)) return;
                    return { v: 4, n: p.reduce((a, x) => a * 256n + BigInt(x), 0n) };
                }

                if (!value.includes(':')) return;
                const h = value.split('::');
                if (h.length > 2) return;

                const l = h[0] ? h[0].split(':') : [],
                    r = h[1] ? h[1].split(':') : [];
                if ([...l, ...r].some((x) => !/^[\da-f]{1,4}$/i.test(x))) return;

                const g =
                    h.length === 2 ? [...l, ...Array(8 - l.length - r.length).fill('0'), ...r] : l;

                if (g.length !== 8) return;
                return { v: 6, n: g.reduce((a, x) => a * 65536n + BigInt('0x' + x), 0n) };
            }

            function range(x, c) {
                const [a, p] = c.split('/'),
                    n = ip(a),
                    bits = x.v === 4 ? 32 : 128,
                    prefix = +p;
                if (!n || n.v !== x.v || !Number.isInteger(prefix) || prefix < 0 || prefix > bits)
                    return false;
                const mask =
                    prefix === 0
                        ? 0n
                        : ((1n << BigInt(bits)) - 1n) ^ ((1n << BigInt(bits - prefix)) - 1n);
                return (x.n & mask) === (n.n & mask);
            }

            function show(html, cls = '') {
                result.className = cls;
                result.innerHTML = html;
            }

            let lists;

            async function load() {
                const data = await Promise.all(
                    URLS.map((u) =>
                        fetch(u).then((r) => {
                            if (!r.ok) throw Error();
                            return r.text();
                        })
                    )
                );

                return {
                    exit: new Set(clean(data[0])),
                    entry: new Set(clean(data[1])),
                    ranges: clean(data[2]),
                };
            }

            $('#form').onsubmit = (e) => {
                e.preventDefault();

                if (!lists) return show('The lists are still loading. Try again shortly.', 'error');

                const value = input.value.trim().toLowerCase(),
                    x = ip(value);
                if (!x) return show('That does not look like a valid IP address.', 'error');

                const matches = [];
                if (lists.exit.has(value)) matches.push('Exit IP');
                if (lists.entry.has(value)) matches.push('Entry IP');
                if (lists.ranges.some((r) => range(x, r))) matches.push('Entry range');

                show(
                    matches.length
                        ? `<div class="yes"><span class="status">YES</span><span>Listed in:</span>
       <div class="tags">${matches.map((x) => `<span class="tag">${x}</span>`).join('')}</div></div>`
                        : `<div class="no"><span class="status">NO</span><span>Not listed in the ProtonVPN lists.</span></div>`
                );
            };

            load()
                .then((x) => {
                    lists = x;
                    button.disabled = false;
                    show('Ready to check.');
                })
                .catch(() => show('Could not load the IP lists. Refresh and try again.', 'error'));
        </script>
    </body>
</html>
