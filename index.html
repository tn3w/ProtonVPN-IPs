<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="Check whether an IP address belongs to ProtonVPN." />
        <title>Is ProtonVPN?</title>
        <style>
            :root {
                --bg: #f7f7fb;
                --glow: #e9e5ff;
                --card: #fff;
                --text: #211b35;
                --muted: #777388;
                --line: #e4e1ed;
                --green: #159b72;
                --red: #d34d67;
                --shadow: 0 12px 35px #211b3512;
                --purple: #6f59f6;
                --font: 'Avenir Next', 'Trebuchet MS', sans-serif;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #111016;
                    --glow: #2b2352;
                    --card: #1c1a23;
                    --text: #f7f5ff;
                    --muted: #aaa5b7;
                    --line: #373441;
                    --green: #2fd6a3;
                    --red: #ff7d94;
                    --shadow: 0 12px 35px #00000059;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: radial-gradient(circle at 20% 10%, var(--glow), transparent 35%)
                    var(--bg);
                color: var(--text);
                font: 16px var(--font);
            }
            main {
                width: min(560px, 100%);
                text-align: center;
            }
            h1 {
                margin: 0 0 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-size: clamp(2.4rem, 9vw, 4rem);
                font-weight: 500;
                letter-spacing: -0.06em;
            }
            .logo {
                width: min(310px, 58vw);
                height: auto;
            }
            form {
                position: relative;
            }
            input {
                width: 100%;
                height: 64px;
                padding: 0 115px 0 20px;
                border: 1px solid var(--line);
                border-radius: 14px;
                background: var(--card);
                color: var(--text);
                outline: 0;
                font: 17px var(--font);
                box-shadow: var(--shadow);
            }
            input:focus {
                border-color: var(--purple);
                box-shadow: 0 0 0 4px #6f59f622, var(--shadow);
            }
            button {
                position: absolute;
                right: 7px;
                top: 7px;
                height: 50px;
                padding: 0 22px;
                border: 0;
                border-radius: 10px;
                background: var(--purple);
                color: #fff;
                font: 800 16px var(--font);
                letter-spacing: 0.01em;
                cursor: pointer;
                box-shadow: 0 5px 14px #6f59f655;
                transition:
                    transform 0.15s,
                    filter 0.15s,
                    box-shadow 0.15s;
            }
            button:hover {
                filter: brightness(1.08);
                transform: translateY(-1px);
                box-shadow: 0 7px 18px #6f59f666;
            }
            button:active {
                transform: translateY(0);
                box-shadow: 0 3px 9px #6f59f644;
            }
            button:disabled {
                opacity: 0.55;
                cursor: wait;
                transform: none;
            }
            #result {
                min-height: 28px;
                margin: 22px 0;
                color: var(--muted);
                line-height: 1.5;
            }
            .answer,
            .tags {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 10px;
            }
            .tags {
                gap: 7px;
            }
            .status {
                font-size: 28px;
                font-weight: 700;
                letter-spacing: 0.03em;
            }
            .yes,
            .tag {
                color: var(--green);
            }
            .no,
            .error {
                color: var(--red);
            }
            .tag {
                padding: 6px 10px;
                border: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
                border-radius: 8px;
                background: color-mix(in srgb, var(--green) 10%, transparent);
                font-size: 14px;
                font-weight: 600;
            }
            footer {
                position: fixed;
                bottom: 18px;
                left: 20px;
                right: 20px;
                text-align: center;
                color: var(--muted);
                font-size: 12px;
            }
            footer a {
                color: inherit;
                text-underline-offset: 3px;
                margin: 0 5px;
            }
            footer a:hover {
                color: var(--text);
            }
            .github {
                width: 13px;
                height: 13px;
                vertical-align: -2px;
                fill: currentColor;
            }
        </style>
    </head>

    <body>
        <main>
            <h1>
                Is
                <svg class="logo" viewBox="0 0 360 120" role="img" aria-label="ProtonVPN">
                    <defs>
                        <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="100%">
                            <stop offset="0%" stop-color="#7253F6" />
                            <stop offset="100%" stop-color="#46DBDB" />
                        </linearGradient>
                        <clipPath id="mark">
                            <path d="M25 40Q20 32 30 34L86 42Q96 43 93 52L65 93Q58 103 52 93Z" />
                        </clipPath>
                    </defs>
                    <g clip-path="url(#mark)">
                        <rect width="120" height="120" fill="#6F59F6" />
                        <polygon points="0,0 48,0 60,120 0,120" fill="url(#shine)" />
                    </g>
                    <text x="115" y="78" font-size="48" font-weight="600">
                        <tspan fill="currentColor">Proton</tspan>
                        <tspan fill="#6F59F6">VPN</tspan>
                    </text>
                </svg>
                ?
            </h1>

            <form id="form">
                <label for="ip" hidden>IP address</label>
                <input
                    id="ip"
                    placeholder="Enter an IP address"
                    autocomplete="off"
                    spellcheck="false"
                    required
                />
                <button id="check" disabled>Check</button>
            </form>

            <div id="result" aria-live="polite">Loading IP lists…</div>
        </main>

        <footer>
            <a href="https://github.com/tn3w/ProtonVPN-IPs">
                <svg class="github" viewBox="0 0 16 16" aria-hidden="true">
                    <path
                        d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.63 5.47 7.7.4.08.55-.18.55-.39 0-.19-.01-.7-.01-1.37-2.23.5-2.7-1.1-2.7-1.1-.36-.94-.89-1.19-.89-1.19-.73-.51.06-.5.06-.5.8.06 1.22.84 1.22.84.72 1.26 1.89.9 2.35.69.07-.53.28-.9.51-1.11-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.61.82-2.18-.08-.21-.36-1.03.08-2.15 0 0 .67-.22 2.2.83A7.45 7.45 0 0 1 8 3.9c.68 0 1.36.09 2 .27 1.53-1.05 2.2-.83 2.2-.83.44 1.12.16 1.94.08 2.15.51.57.82 1.29.82 2.18 0 3.12-1.87 3.8-3.65 4.01.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.14.47.55.39A8.14 8.14 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"
                    />
                </svg>
                GitHub
            </a>
            <span>·</span>
            <a href="https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_ips.txt">exit IPs</a>
            <a href="https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_entry_ips.txt">entry IPs</a>
            <a href="https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/protonvpn_entry_ip_ranges.txt">ranges</a>
            <span>·</span>
            <a href="https://github.com/tn3w/ProtonVPN-IPs#files">how to load</a>
        </footer>

        <script>
            const BASE =
                'https://raw.githubusercontent.com/tn3w/ProtonVPN-IPs/refs/heads/master/';

            const result = document.querySelector('#result');
            const input = document.querySelector('#ip');
            const button = document.querySelector('#check');

            async function fetchList(file) {
                const response = await fetch(BASE + file);
                if (!response.ok) throw Error(file);

                const text = await response.text();
                return text
                    .split(/\r?\n/)
                    .map((line) => line.trim().toLowerCase())
                    .filter((line) => line && !line.startsWith('#'));
            }

            async function loadLists() {
                const [exit, entry, ranges] = await Promise.all(
                    [
                        'protonvpn_ips.txt',
                        'protonvpn_entry_ips.txt',
                        'protonvpn_entry_ip_ranges.txt',
                    ].map(fetchList)
                );
                return { exit: new Set(exit), entry: new Set(entry), ranges };
            }

            function parseIp(value) {
                if (value.includes('.')) {
                    const parts = value.split('.');
                    const invalid = (x) => !/^\d+$/.test(x) || +x > 255;
                    if (parts.length !== 4 || parts.some(invalid)) return;
                    return { bits: 32, number: parts.reduce((a, x) => a * 256n + BigInt(x), 0n) };
                }

                if (!value.includes(':')) return;
                const halves = value.split('::');
                if (halves.length > 2) return;

                const [head, tail] = halves;
                const left = head ? head.split(':') : [];
                const right = tail ? tail.split(':') : [];
                if ([...left, ...right].some((x) => !/^[\da-f]{1,4}$/i.test(x))) return;

                const groups =
                    tail === undefined
                        ? left
                        : [...left, ...Array(8 - left.length - right.length).fill('0'), ...right];
                if (groups.length !== 8) return;

                const number = groups.reduce((a, x) => a * 65536n + BigInt('0x' + x), 0n);
                return { bits: 128, number };
            }

            function inRange(address, cidr) {
                const [network, prefixText] = cidr.split('/');
                const base = parseIp(network);
                const prefix = +prefixText;
                if (!base || base.bits !== address.bits) return false;
                if (!Number.isInteger(prefix) || prefix < 0 || prefix > address.bits) return false;

                const size = BigInt(address.bits);
                const mask = ((1n << size) - 1n) ^ ((1n << (size - BigInt(prefix))) - 1n);
                return (address.number & mask) === (base.number & mask);
            }

            function show(html, className = '') {
                result.className = className;
                result.innerHTML = html;
            }

            let lists;

            document.querySelector('#form').onsubmit = (event) => {
                event.preventDefault();
                if (!lists) return show('The lists are still loading. Try again shortly.', 'error');

                const value = input.value.trim().toLowerCase();
                const address = parseIp(value);
                if (!address) return show('That does not look like a valid IP address.', 'error');

                const matches = [];
                if (lists.exit.has(value)) matches.push('Exit IP');
                if (lists.entry.has(value)) matches.push('Entry IP');
                if (lists.ranges.some((cidr) => inRange(address, cidr))) matches.push('Entry range');

                const tags = matches.map((x) => `<span class="tag">${x}</span>`).join('');
                show(
                    matches.length
                        ? `<div class="answer"><span class="status yes">YES</span>
                           <span>Listed in:</span><div class="tags">${tags}</div></div>`
                        : `<div class="answer"><span class="status no">NO</span>
                           <span>Not listed in the ProtonVPN lists.</span></div>`
                );
            };

            loadLists()
                .then((loaded) => {
                    lists = loaded;
                    button.disabled = false;
                    show('Ready to check.');
                })
                .catch(() => show('Could not load the IP lists. Refresh and try again.', 'error'));
        </script>
    </body>
</html>
